name: Native OpenCode and NTFS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / OpenCode v2.2.5 + NTFS
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build plugin
        run: |
          npm ci
          npm run build
      - name: Install actual OpenCode v2.2.5 executable
        run: npm install --prefix "$RUNNER_TEMP/native-opencode" --no-save --no-audit --no-fund @opencode/cli@2.2.5
      - name: Real native OpenCode integration
        run: node scripts/tests/test-native-opencode-host.mjs
        env:
          SKIP_NETWORK: '1'
      - name: Windows NTFS ACL audit (synthetic credentials only)
        run: node scripts/tests/test-windows-ntfs-acl.mjs
  macos:
    name: macOS / OpenCode v2.2.5
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build plugin
        run: |
          npm ci
          npm run build
      - name: Install actual OpenCode v2.2.5 executable
        run: npm install --prefix "$RUNNER_TEMP/native-opencode" --no-save --no-audit --no-fund @opencode/cli@2.2.5
      - name: Real native OpenCode integration
        run: node scripts/tests/test-native-opencode-host.mjs
        env:
          SKIP_NETWORK: '1'
